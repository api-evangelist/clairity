name: Clairity
description: 'Clairity Technology Inc. is a Los Angeles based climate-tech company building gigaton-scale
  carbon dioxide removal using Direct Air Capture (DAC) paired with ex-situ mineralization. Their approach
  removes CO2 from the atmosphere with readily available, inexpensive chemicals and standard construction
  materials to produce concentrated CO2 streams for permanent removal and storage. Clairity operates
  Project Juniper, a live carbon-removal facility in Southern Nevada, and raised a $6.75M seed round in
  2024. As a hardware and carbon-removal operator the company publishes no public developer API, SDKs, or
  documentation surface at this time; this profile captures its public identity and domain-security
  posture in the API Evangelist network.'
